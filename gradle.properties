android.useAndroidX=true
kotlin.code.style=official

# Optimize Gradle and JVM memory footprint for 8GB RAM Macs
org.gradle.jvmargs=-Xmx1536m -XX:+UseParallelGC -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Limit Kotlin daemon memory usage
kotlin.daemon.jvmargs=-Xmx1024m

android.nonTransitiveRClass=true
